# ============================================================================
# HYPRLOCK - Official Catppuccin Mocha Lockscreen (Pastel Theme)
# ============================================================================

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgba(1e1e2eff)
}

input-field {
    monitor =
    size = 260, 44
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.2
    outer_color = rgba(89b4faff)
    inner_color = rgba(313244ff)
    font_color = rgba(cdd6f4ff)
    check_color = rgba(94e2d5ff)
    fail_color = rgba(f38ba8ff)
    fade_on_empty = false
    placeholder_text = <i>Passwort...</i>
    rounding = 0
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(cdd6f4ff)
    font_size = 48
    font_family = JetBrainsMono Nerd Font
    position = 0, 50
    halign = center
    valign = center
}
