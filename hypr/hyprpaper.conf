# ============================================================================
# hyprpaper - Wallpaper-Daemon
# ============================================================================
# Die Wallpapers selbst werden NICHT hier eingetragen, sondern über den
# Wallpaper-Switcher verwaltet (~/.config/wallpaper/wallpaper.sh).
