# ============================================================================
# FOOT KONFIGURATION - Official Catppuccin Mocha (Pastel Theme)
# ============================================================================

[main]
shell=/usr/bin/zsh
font=JetBrainsMono Nerd Font:size=10.5
pad=8x8

[bell]
urgent=no
notify=no

[cursor]
style=block

[colors-dark]
alpha=0.90
background=1e1e2e
foreground=cdd6f4
cursor=1e1e2e f5e0dc

selection-background=313244
selection-foreground=cdd6f4

# Regular Colors
regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
regular7=bac2de

# Bright Colors
bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=cba6f7
bright6=94e2d5
bright7=a6adc8
