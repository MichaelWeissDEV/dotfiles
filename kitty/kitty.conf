# ============================================================================
# KITTY KONFIGURATION - Official Catppuccin Mocha (Pastel Theme)
# ============================================================================

# Schriftart (ohne Ligaturen)
font_family      JetBrainsMonoNL Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5
disable_ligatures always

# Minimalistisches Layout & Verhalten (Startet direkt mit Zsh + Oh My Zsh)
shell                   /usr/bin/zsh
window_padding_width    8
confirm_os_window_close 0
enable_audio_bell       no
cursor_shape            block
cursor_blink_interval   0
url_style               straight

# Leicht transparent (0.90) mit Catppuccin Mocha Pastellfarben
background_opacity         0.90
dynamic_background_opacity yes

# ============================================================================
# CATPPUCCIN MOCHA PALETTE (Soothing Pastel Theme)
# ============================================================================
# Grundfarben (Base #1e1e2e, Text #cdd6f4)
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #89b4fa

# Cursor (Rosewater / Pastel Blue)
cursor                  #f5e0dc
cursor_text_color       #1e1e2e

# URL-Farbe (Pastel Sapphire/Blue)
url_color               #89b4fa

# Fensterrahmen (Blue & Surface1)
active_border_color     #89b4fa
inactive_border_color   #313244
bell_border_color       #f38ba8

# Tab-Leiste (Mantle/Crust & Pastel Blue)
active_tab_foreground   #11111b
active_tab_background   #89b4fa
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b
tab_bar_style           powerline

# Schwarz / Surface1 & Surface2
color0  #45475a
color8  #585b70

# Rot / Pastel Red & Maroon
color1  #f38ba8
color9  #f38ba8

# Grün / Pastel Green
color2  #a6e3a1
color10 #a6e3a1

# Gelb / Pastel Yellow
color3  #f9e2af
color11 #f9e2af

# Blau / Pastel Blue
color4  #89b4fa
color12 #89b4fa

# Magenta / Pastel Pink & Mauve
color5  #f5c2e7
color13 #cba6f7

# Cyan / Pastel Teal
color6  #94e2d5
color14 #94e2d5

# Weiß / Subtext & Text
color7  #bac2de
color15 #a6adc8
