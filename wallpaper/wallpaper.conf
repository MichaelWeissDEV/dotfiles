# ============================================================================
# ~/.config/wallpaper/wallpaper.conf - Wallpaper-Bibliothek & Voreinstellungen
# ============================================================================
# Wird von ~/.config/wallpaper/wallpaper.sh (CLI: "wallpaper") eingelesen.

# Ordner und Dateimuster, die nach Wallpapers durchsucht werden.
# Ordner werden rekursiv gelesen; Dateimuster (z. B. /usr/share/hypr/wall*.png)
# sind ebenfalls erlaubt.
#
# Das private Wallpaper-Repo liegt unter ~/git/dotfiles/pictures und ist im
# Dotfiles-Repo per .gitignore ausgeschlossen (Urheberrecht). DOTFILES_ROOT
# wird vom Wallpaper-Skript gesetzt; der Fallback funktioniert auch beim
# manuellen Sourcen.
WALLPAPER_DIRS=(
    "${DOTFILES_ROOT:-$HOME/git/dotfiles}/pictures"
    "/usr/share/hypr/wall*.png"
)

# Darstellung: cover | contain | tile | fill
WALLPAPER_FIT="cover"

# Desktop-Benachrichtigung nach dem Wechsel (1 = an, 0 = aus)
WALLPAPER_NOTIFY=1
