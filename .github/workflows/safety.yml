name: Fast installation safety

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ARCH_DOTFILES_SOURCE_ROOT: ${{ github.workspace }}/.sources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Clone read-only public component sources
        run: python3 scripts/clone-repos.py --root .sources --https
      - name: Check installer, backup, upgrade and deactivation behaviour in temporary homes
        run: |
          bash -n install.sh packaging/arch/build.sh packaging/arch/create-repo.sh
          python3 -B -m unittest discover -s packaging/arch/tests -v
          python3 packaging/arch/check-component.py
      - name: Build central documentation strictly
        run: |
          python -m pip install -r docs/requirements.txt
          sphinx-build -W --keep-going -b dirhtml docs "$RUNNER_TEMP/arch-dotfiles-docs"
