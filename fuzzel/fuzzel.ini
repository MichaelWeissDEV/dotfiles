# ============================================================================
# FUZZEL APP-LAUNCHER - Official Catppuccin Mocha (Pastel Theme)
# ============================================================================

[main]
font=JetBrainsMono Nerd Font:size=10.5
dpi-aware=no
use-bold=yes
prompt="󰍉  "
placeholder=Programm suchen oder starten...
icon-theme=Adwaita
icons-enabled=yes
image-size-ratio=0
match-counter=yes
fields=name,generic,comment,categories,keywords,exec,filename
terminal=kitty -e
width=44
lines=10
line-height=24px
horizontal-pad=14
vertical-pad=10
inner-pad=8
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=1e1e2eff
text=cdd6f4ff
prompt=89b4faff
placeholder=6c7086ff
input=cdd6f4ff
match=94e2d5ff
selection=313244ff
selection-text=cdd6f4ff
selection-match=a6e3a1ff
counter=6c7086ff
border=89b4faff

[border]
width=1
radius=0
selection-radius=0
